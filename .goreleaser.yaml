version: 2

project_name: ansible-static-lint

before:
  hooks:
    - go mod tidy

builds:
  - id: astl
    main: ./cmd/astl
    binary: astl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Keep the -X package path equal to the Makefile's VERSION_PKG.
      - -s -w
      # .Version drops the tag's leading v, which the other two build paths
      # keep: `git describe` stamps v0.1.0, and so does the module version a
      # `go install` reads back out of the build info. Put it back so all three
      # report the same string. Archive names below stay unprefixed.
      - -X main.Version=v{{ .Version }}
      - -X main.GitCommit={{ .ShortCommit }}
      - -X main.BuildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Both need a tool on PATH in CI: syft (SBOM) and cosign (signing). See
# .github/workflows/release.yml; without those installer steps goreleaser fails
# with "syft/cosign: executable file not found".
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
      - --yes
    artifacts: checksum

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
