# CI for ansible-static-lint. Calls `make` targets so CI and local never drift.
# Tool versions are pinned here and in the Makefile; keep the two equal.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. release.yml gets write.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The Linux names predate the other runners and are required checks, so
    # only the added runners carry a suffix.
    name: test (go ${{ matrix.go }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Floor = the go.mod minimum (keep in sync); "stable" = latest release,
        # which is also what release.yml ships with. Releases also ship macOS
        # and Windows binaries, which run the suite on stable only.
        os: [ubuntu-latest]
        go: ["1.26", "stable"]
        include:
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # `make check` builds, so it replaces a bare `make build` here. It is also
      # the README quickstart, which keeps the first command a newcomer types
      # from being the one command nothing verifies.
      # The action and wheel jobs already run the binary over the examples on
      # macOS and Windows.
      - name: Build and smoke check the examples
        if: runner.os == 'Linux'
        run: make check
      - name: Test (race)
        if: runner.os != 'Windows'
        run: make test
      # Windows runners are not guaranteed a GNU make, so this is make test's
      # recipe run directly.
      - name: Test (race, Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go test -race ./...

  lint:
    name: lint + vuln + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Pre-install the pinned tools so `make audit` reuses them instead of
      # bootstrapping via `make tools`. Versions MUST equal the Makefile's.
      # Both floors exist for one reason: each tool builds an IR over the
      # stdlib, and Go 1.27 added promoted-field struct literals, which older
      # IR builders meet in internal/poll on linux and die on with
      # `unexpected expr: *ast.KeyValueExpr`. This job runs `go-version:
      # stable`, so it is where that stdlib lands first. golangci-lint v2.13.1
      # is the first release bundling staticcheck v0.8.0; govulncheck v1.7.0
      # carries an x/tools SSA builder new enough for the same reason. The Go
      # 1.27.2 stdlib then shipped export data version 5, which the x/tools v0.49.0
      # in golangci-lint v2.13.x rejects at typecheck; v2.14.0 (x/tools
      # v0.50.0) reads it. Neither is a routine bump: do not lower them to
      # match an older Go.
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
      # make audit = coverage gate + go mod verify + golangci-lint + deadcode +
      # govulncheck.
      # One code path, local and CI.
      - name: Audit
        run: make audit

  workflows:
    name: workflow + shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Versions MUST equal the Makefile's. shellcheck ships on the runner.
      - name: Install pinned tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pipx install zizmor==1.31.1
      - name: Lint workflows, action and scripts
        run: make workflows

  parity:
    name: ansible-lint output parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ansible-static-lint
      # The reference corpus and frozen ansible-lint output live in a separate
      # repository because they carry ansible-lint test data (GPL-3.0-or-later).
      # ansible-static-lint itself ships none of it and stays MIT, so the corpus is fetched
      # here rather than vendored.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: arhuman/astl-compatibility-check
          path: astl-compatibility-check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Assert output parity against the frozen corpus
        run: make -C ansible-static-lint parity

  bench:
    name: speed guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ansible-static-lint
      # Same split as the parity job, and for the same licensing reason: the
      # corpus this is timed against is ansible-lint test data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: arhuman/astl-compatibility-check
          path: astl-compatibility-check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # The budget is ~4x the current time, so a shared runner's noise cannot
      # trip it; only a structural regression does. astl's speed is the reason
      # it exists, and until this ran here nothing measured it automatically.
      - name: Assert the corpus lints within its budget
        run: make -C ansible-static-lint bench

  action:
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs the action against the examples fixture, which has a frozen
      # expected output and a known exit code. Asserting both is what separates
      # "the action ran" from "the action produced the right findings".
      #
      # This exercises the published release, not the working tree: the action
      # downloads a release archive by design, so a change to the archive layout
      # is only proven by the run that follows its release. Keep the version
      # pinned to the newest release rather than `latest`, so a failure here
      # names a known binary instead of drifting under the job. The release
      # commit cannot stamp it, since it is pushed before its release exists;
      # scripts/release-preflight.sh refuses a release while it trails.
      - id: run
        uses: ./ # zizmor: ignore[self-repository] the step under test is this checkout's action.yml
        with:
          paths: examples
          version: v0.7.2 # newest-release
          output: astl-out.txt
          fail-on-findings: "false"
      - name: Assert exit code and output
        shell: bash
        env:
          CODE: ${{ steps.run.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [ "$CODE" != "2" ]; then
            echo "::error::expected exit code 2 (violations found), got $CODE" >&2
            exit 1
          fi
          # astl normalizes every emitted path with filepath.ToSlash, so the
          # fixture is byte-comparable on Windows too; .gitattributes keeps the
          # checked-out fixture LF so only real differences show up here.
          diff -u examples/expected.txt astl-out.txt

  wheel:
    name: pipx install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # Same as release.yml: goreleaser builds here, so no shared cache.
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The README tells Windows users to `pipx install ansible-static-lint`,
      # and until this job existed nothing ran that path. The `action` job
      # covers the download-a-release route; this one covers the wheel, which
      # is a different artifact built by a different script.
      #
      # It packs from the working tree rather than a published release, so a
      # change that breaks the wheel fails the pull request that made it
      # instead of the release that ships it. goreleaser's snapshot mode gives
      # build_wheels.py the archive layout it expects; signing and SBOMs are
      # skipped because nothing here is published.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish,announce
      - name: Pack the wheels
        shell: bash
        run: |
          set -euo pipefail
          # The snapshot version carries a -SNAPSHOT-<sha> suffix that is not
          # PEP 440; --archive-version names the archives, --version names the
          # wheel, which is exactly the split the release rehearsal uses. The
          # wheel version is a placeholder because nothing here is published:
          # what is under test is that the wheel installs and runs, not what it
          # is called. These wheels also carry no SBOM, since sbom is skipped
          # above; release.yml is the path that ships one.
          shopt -s nullglob
          zips=(dist/*_windows_amd64.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::expected one windows_amd64 archive, found ${#zips[@]}" >&2
            exit 1
          fi
          archive_version=$(basename "${zips[0]}" \
            | sed -E 's#^ansible-static-lint_(.+)_windows_amd64\.zip$#\1#')
          echo "packing wheels from archive version $archive_version"
          python scripts/build_wheels.py \
            --version 0.0.0 \
            --archive-version "$archive_version" \
            --archives dist --out dist/wheels

      - name: Install it the way the README says
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pipx
          shopt -s nullglob
          case "${{ runner.os }}-${{ runner.arch }}" in
            Windows-X64) wheels=(dist/wheels/*win_amd64.whl) ;;
            Linux-X64)   wheels=(dist/wheels/*manylinux*x86_64.whl) ;;
            *) echo "::error::no wheel mapped for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::expected one matching wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheel=${wheels[0]}
          echo "pipx install $wheel"
          python -m pipx install "$wheel"
          python -m pipx ensurepath
          printf '%s\n' "$(python -m pipx environment --value PIPX_BIN_DIR)" >> "$GITHUB_PATH"

      # Same assertion as the action job: an install that runs proves less than
      # one that produces the right findings.
      - name: Assert exit code and output
        shell: bash
        run: |
          set -euo pipefail
          astl --version
          code=0
          astl examples > astl-out.txt || code=$?
          if [ "$code" != "2" ]; then
            echo "::error::expected exit code 2 (violations found), got $code" >&2
            cat astl-out.txt >&2
            exit 1
          fi
          # astl normalizes emitted paths with filepath.ToSlash and
          # .gitattributes keeps the fixture LF, so this compares byte for byte
          # on Windows too.
          diff -u examples/expected.txt astl-out.txt

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conventional Commits on PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_.-]+\))?(!)?: .+'
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit $sha is not Conventional Commits: '$subject'"
              fail=1
            fi
          done
          exit $fail
