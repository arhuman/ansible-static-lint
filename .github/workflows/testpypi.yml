# TestPyPI rehearsal: the dry run for the PyPI job in release.yml.
#
# A PyPI version is permanent, so a broken upload cannot be deleted or
# re-uploaded, only abandoned. This workflow exercises the same build and the
# same verification against TestPyPI, which is disposable, so the first real
# publish is not the first attempt.
#
# Manual only: it never runs on a tag, creates no GitHub Release, and reads an
# already-published one. Keep its steps in sync with release.yml's pypi job.
name: TestPyPI rehearsal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to repack, e.g. v0.5.1
        required: true
        default: v0.5.1
      suffix:
        description: >-
          Appended to the version, e.g. rc1 uploads 0.5.1rc1. TestPyPI also
          burns a version permanently, so bump this to retry the same tag.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  testpypi:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read # download the release assets
      id-token: write # TestPyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Same verification as the real job: the point of a rehearsal is to
      # exercise the step that could fail, not a shortened version of it.
      - name: Download and verify release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/archives
          gh release download "$TAG" --dir dist/archives \
            --pattern '*.tar.gz' --pattern '*.zip' --pattern '*.sbom.json' \
            --pattern 'checksums.txt' --pattern 'checksums.txt.sigstore.json'
          cosign verify-blob \
            --bundle dist/archives/checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/archives/checksums.txt
          cd dist/archives && sha256sum --check checksums.txt

      - name: Build wheels
        env:
          TAG: ${{ inputs.tag }}
          SUFFIX: ${{ inputs.suffix }}
        run: |
          set -euo pipefail
          # The archives carry the bare version in their filenames, while the
          # wheel may need a suffix to claim an unused TestPyPI version.
          # --archive-version keeps the two apart.
          python scripts/build_wheels.py \
            --version "${TAG#v}${SUFFIX}" \
            --archive-version "${TAG#v}" \
            --archives dist/archives \
            --out dist/wheels
          ls -1 dist/wheels
          if compgen -G 'dist/wheels/*-any.whl' >/dev/null; then
            echo "refusing to publish a py3-none-any wheel" >&2
            exit 1
          fi

      - name: Smoke test the linux wheel
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --no-index --find-links dist/wheels ansible-static-lint
          # Fails if the binary installed without its exec bit.
          test -x /tmp/v/bin/astl
          /tmp/v/bin/astl --version
          # --help exits 1 like any Go flag package usage message, so check the
          # usage text rather than the exit code. Capture before testing: a
          # grep -q would close the pipe early and trip pipefail on SIGPIPE.
          help=$(/tmp/v/bin/astl --help 2>&1 || true)
          case "$help" in
            "usage: astl"*) ;;
            *) echo "astl --help printed no usage text" >&2; exit 1 ;;
          esac

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/wheels
          attestations: true
