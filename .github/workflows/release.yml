# Release: a v* tag triggers goreleaser. Pairs with .goreleaser.yaml.
name: Release

on:
  push:
    tags: ["v*"]

# Release creates the GitHub Release and uploads assets.
permissions:
  contents: write
  id-token: write # cosign keyless signing (OIDC), per .goreleaser.yaml signs:

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs full history and tags to build the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Ship binaries built with the latest stable Go for all runtime and
          # stdlib security fixes, independent of the go.mod floor.
          go-version: stable
      # .goreleaser.yaml declares sboms: and signs:, so syft and cosign must be
      # on PATH or the release fails with "executable file not found".
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
